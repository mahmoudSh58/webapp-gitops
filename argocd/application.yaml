apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp
  namespace: argocd                  # Applications live in the Argo CD namespace
spec:
  project: default

  # WHERE the desired state comes from
  source:
    repoURL: https://github.com/<your-user>/webapp-gitops.git
    targetRevision: main
    path: charts/webapp-stack
    helm:
      releaseName: webapp
      valueFiles:
        - ../../environments/dev/values.yaml   # relative to "path"

  # WHERE it is deployed
  destination:
    server: https://kubernetes.default.svc   # the cluster Argo CD runs in
    namespace: webapp-stack

  # HOW it is kept in sync
  syncPolicy:
    automated:
      prune: true                    # delete resources that were removed from Git
      selfHeal: true                 # revert manual changes in the cluster
    syncOptions:
      - CreateNamespace=true

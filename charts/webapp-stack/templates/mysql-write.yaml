apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-write
  namespace: {{ .Release.Namespace }}
  labels:
    app: mysql
    role: write
    {{- include "webapp-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mysql.write.replicaCount }}
  strategy:
    type: Recreate              # never run two servers on the same data folder
  selector:
    matchLabels:
      app: mysql
      role: write
  template:
    metadata:
      labels:
        app: mysql
        role: write
    spec:
      containers:
        - name: mysql
          image: "{{ .Values.mysql.write.image.repository }}:{{ .Values.mysql.write.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.write.image.pullPolicy }}
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROLE
              value: source
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: APP_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: webapp-config
                  key: MYSQL_DATABASE
            - name: APP_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: app-user
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: app-password
            - name: MYSQL_REPL_USER
              value: {{ .Values.mysql.auth.replicationUser | quote }}
            - name: MYSQL_REPL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: replication-password
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            initialDelaySeconds: 60
            periodSeconds: 10
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
              subPath: write            # folder "write" on the PVC
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-write
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "webapp-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: mysql
    role: write
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
  labels:
    {{- include "webapp-stack.labels" . | nindent 4 }}
spec:
  storageClassName: {{ .Values.storage.storageClassName }}
  capacity:
    storage: {{ .Values.storage.pv.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: {{ .Values.storage.pv.hostPath }}
    type: DirectoryOrCreate
  # hostPath lives on one node: every MySQL Pod is scheduled there
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ .Values.storage.pv.node }}

apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "webapp-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-password: {{ .Values.mysql.auth.rootPassword | quote }}
  app-user: {{ .Values.mysql.auth.user | quote }}
  app-password: {{ .Values.mysql.auth.password | quote }}
  replication-password: {{ .Values.mysql.auth.replicationPassword | quote }}
